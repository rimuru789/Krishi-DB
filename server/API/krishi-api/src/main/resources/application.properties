spring.application.name=krishi-api

# Import optional local configuration for development (ignored by git and docker)
spring.config.import=optional:file:./application-local.properties,optional:file:./config/application-local.properties,optional:file:./server/API/krishi-api/application-local.properties

# Server Port (Render sets $PORT dynamically; default to 8080 locally)
server.port=${PORT:8080}

# Database Connection (Supplied via environment variables for Aiven / Cloud; defaults to local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/krishidb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for cloud free-tier connection limits and TLS)
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
